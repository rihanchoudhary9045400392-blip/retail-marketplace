<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0868ed"><title>Second-hand Payment Review — RETAIL</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f5f8fc;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.panel{background:white;border:1px solid #dfe7f1;border-radius:14px;padding:20px;margin:16px 0}.field{display:block;width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:8px;margin:8px 0 14px;box-sizing:border-box;font:inherit}.btn{border:0;border-radius:8px;padding:11px 15px;background:#0757d9;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.reject{background:#b42318}.muted{color:#68778d;font-size:13px;line-height:1.5}.listing{border:1px solid #e1e8f0;border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.status{font-weight:800}.error{color:#b42318}
</style></head><body><header class="top"><a class="brand" href="index.html">RETAIL</a><div style="flex:1"></div><a class="navbtn" href="sell-second-hand.html">Sell Second-hand</a><a class="navbtn" href="second-hand.html">Buy Second-hand</a></header>
<main class="wrap"><h1>Second-hand payment approvals</h1><p class="muted">Admin only. Match the ₹10 amount and UTR against your actual PhonePe/UPI transaction history before approving. Never approve based on a screenshot alone.</p>
<section class="panel" id="loginPanel"><h2>Admin login</h2><form id="loginForm"><label>Email</label><input class="field" id="email" type="email" required autocomplete="username" placeholder="Admin email"><label>Password</label><input class="field" id="password" type="password" required autocomplete="current-password" placeholder="RETAIL account password"><button class="btn" type="submit">Sign in</button> <button class="btn" id="createAccount" type="button">Create admin account</button> <button class="btn" id="resetPassword" type="button">Forgot password</button><p id="loginMsg" class="muted" role="status"></p></form></section>
<section class="panel" id="reviewPanel" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2>Pending listings</h2><p class="muted" id="signedInAs"></p></div><div class="actions"><button class="btn" id="reload" type="button">Refresh</button><button class="btn reject" id="logout" type="button">Log out</button></div></div><p id="resultMsg" class="muted" role="status"></p><div id="listings">Loading…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>
const URL="https://oebapdfkaumpmwdblqbv.supabase.co",KEY="sb_publishable_wmNek6qB6MCiPIJzueJhVQ_7-6d42yl",ADMIN="rihanchoudhary9045400392@gmail.com",$=id=>document.getElementById(id);
let db;
try { if(!window.supabase?.createClient) throw new Error("Login service could not load. Check internet and reopen this page."); db=window.supabase.createClient(URL,KEY); }
catch(e){ $("loginMsg").textContent=e.message; $("loginMsg").className="muted error"; $("loginForm").querySelectorAll("button").forEach(b=>b.disabled=true); }
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showMessage(t,error=false){$("resultMsg").textContent=t;$("resultMsg").className=error?"muted error":"muted"}
async function checkAuth(){const {data}=await db.auth.getUser();const user=data?.user;if(user&&String(user.email||"").toLowerCase()===ADMIN){$("loginPanel").hidden=true;$("reviewPanel").hidden=false;$("signedInAs").textContent="Signed in as "+user.email;await loadPending()}else{$("loginPanel").hidden=false;$("reviewPanel").hidden=true;if(user){showLoginMessage("This account is not authorized for admin review.");await db.auth.signOut()}}}
function showLoginMessage(t){$("loginMsg").textContent=t}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!db){showLoginMessage("Login service unavailable. Please reopen this page.");return}const email=$("email").value.trim().toLowerCase(),password=$("password").value; if(email!==ADMIN){showLoginMessage("Only the authorized admin email can sign in.");return}showLoginMessage("Signing in…");try{const {error}=await db.auth.signInWithPassword({email,password});if(error){showLoginMessage("Sign-in failed: "+error.message);return}showLoginMessage("Signed in. Loading approvals…");await checkAuth()}catch(err){showLoginMessage("Login error: "+(err?.message||String(err))) }});
$("createAccount").addEventListener("click",async()=>{if(!db)return;const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(email!==ADMIN){showLoginMessage("Enter the authorized admin email first.");return}if(password.length<6){showLoginMessage("Enter a password with at least 6 characters.");return}showLoginMessage("Creating account…");try{const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}});if(error){showLoginMessage("Account creation failed: "+error.message);return}if(data.session){showLoginMessage("Account created. Signing in…");await checkAuth()}else{showLoginMessage("Signup request accepted. Check this email inbox for a confirmation link, then return here and sign in. If account already exists, use Forgot password.")}}catch(err){showLoginMessage("Account error: "+(err?.message||String(err))) }});
$("resetPassword").addEventListener("click",async()=>{if(!db)return;const email=$("email").value.trim().toLowerCase();if(email!==ADMIN){showLoginMessage("Enter the authorized admin email first.");return}showLoginMessage("Sending password reset email…");try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});showLoginMessage(error?"Reset failed: "+error.message:"If this email has an account, a password-reset link has been sent. Check inbox and spam.")}catch(err){showLoginMessage("Reset error: "+(err?.message||String(err)))}});
async function loadPending(){ $("listings").textContent="Loading pending listings…";showMessage("");const {data,error}=await db.from("second_hand_listings").select("id,title,description,price,item_condition,image_url,city,seller_name,seller_phone,payment_reference,payment_status,status,created_at,seller_id").eq("status","pending_review").order("created_at",{ascending:true});if(error){$("listings").textContent="Could not load listings: "+error.message;return}if(!data?.length){$("listings").innerHTML="<p class='muted'>No pending listings right now.</p>";return}
$("listings").innerHTML=data.map(x=>`<article class="listing"><h3>${esc(x.title)} — ₹${Number(x.price||0).toLocaleString("en-IN")}</h3><p>${esc(x.description)}</p><p><b>Condition:</b> ${esc(x.item_condition)} · <b>City:</b> ${esc(x.city)}</p><p><b>Seller:</b> ${esc(x.seller_name)} · <b>WhatsApp:</b> ${esc(x.seller_phone)}</p><p><b>Payment UTR/reference:</b> <span class="status">${esc(x.payment_reference||"Not provided")}</span></p><p><b>Payment status:</b> ${esc(x.payment_status)} · <b>Submitted:</b> ${esc(new Date(x.created_at).toLocaleString("en-IN"))}</p>${x.image_url?`<p><a href="${esc(x.image_url)}" target="_blank" rel="noopener">Open item photo</a></p>`:""}<p class="muted">Verify this UTR and exact ₹10 credit in PhonePe/UPI transaction history before approval.</p><div class="actions"><button class="btn" data-action="approve" data-id="${esc(x.id)}">Approve payment & publish</button><button class="btn reject" data-action="reject" data-id="${esc(x.id)}">Reject listing</button></div></article>`).join("");
$("listings").querySelectorAll("button[data-action]").forEach(b=>b.addEventListener("click",async()=>{const approve=b.dataset.action==="approve";if(approve&&!confirm("Have you personally verified the ₹10 credit and matching UTR in PhonePe transaction history? Approve and publish this listing?"))return;if(!approve&&!confirm("Reject this listing? It will stay hidden from buyers."))return;const all=$("listings").querySelectorAll("button");all.forEach(z=>z.disabled=true);const patch=approve?{status:"active",payment_status:"verified"}:{status:"rejected",payment_status:"rejected"};const {data:updated,error:updateError}=await db.from("second_hand_listings").update(patch).eq("id",b.dataset.id).eq("status","pending_review").select("id");if(updateError){showMessage("Update failed: "+updateError.message,true);all.forEach(z=>z.disabled=false);return}if(!updated?.length){showMessage("No listing changed. Refresh and check admin authorization.",true);all.forEach(z=>z.disabled=false);return}showMessage(approve?"Payment marked verified and listing published.":"Listing rejected.");await loadPending()}));
}
$("reload").addEventListener("click",loadPending);$("logout").addEventListener("click",async()=>{await db.auth.signOut();await checkAuth()});checkAuth();
</script></body></html>
